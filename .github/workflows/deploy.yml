name: Deploy MainApi Worker

# Every push to main is linted, tested and published to the Cloudflare Worker
# "odivon-main-api" (mainapi.odivon.com). Runtime secrets (Firebase, iyzico, …) stay in the
# Worker; CI only needs a Cloudflare API token. `wrangler deploy` runs the build command from
# wrangler.jsonc (nest build, worker assets, OpenAPI generation).
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-mainapi
  cancel-in-progress: false

jobs:
  deploy:
    name: Test & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npx eslint src

      - name: Unit tests
        run: npx jest --ci

      - name: Production build
        run: npm run build

      - name: Reject committed secrets
        run: "! git grep -nE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|FIREBASE_PRIVATE_KEY=[^-]|IYZICO_SECRET_KEY=[^$]|sk_live_[A-Za-z0-9]+|AKIA[0-9A-Z]{16})' -- ':!package-lock.json' ':!.github/workflows/deploy.yml' ':!.env.example' ':!src/config/env.schema.spec.ts'"

      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Report native Cloudflare deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Cloudflare secrets are not configured; the connected Workers Build handles deployment."
